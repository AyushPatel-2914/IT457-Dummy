# S2 shape run locally: three services, nginx in place of the ALB's path routing.
# The three services share one network namespace and call each other on 127.0.0.1, exactly as
# they do on an S2 EC2 instance (docker --network host), so no DNS lookup sits in the call path.
#   BREAKER=on  docker compose -f docker-compose.services.yml up -d --build   ->  http://localhost:8081
#   docker compose -f docker-compose.services.yml stop recommendations       (experiment E4)
x-app: &app
  build: .
  depends_on: {db: {condition: service_healthy}}
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: minix, POSTGRES_PASSWORD: minix, POSTGRES_DB: minix}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "minix"], interval: 2s, retries: 30}
  catalogue:
    <<: *app
    hostname: instance-local
    environment:
      SERVICE: catalogue
      PORT: 5001
      DATABASE_URL: postgresql://minix:minix@db:5432/minix
      RECS_URL: http://127.0.0.1:5002
      BREAKER: ${BREAKER:-on}
    ports: ["5002:5002"]   # published here because catalogue owns the shared namespace
  recommendations:
    <<: *app
    network_mode: "service:catalogue"
    environment:
      SERVICE: recommendations
      PORT: 5002
      DATABASE_URL: postgresql://minix:minix@db:5432/minix
      FAULTS_ENABLED: "1"
    depends_on: [catalogue]
  auth:
    <<: *app
    network_mode: "service:catalogue"
    environment:
      SERVICE: auth
      PORT: 5003
      DATABASE_URL: postgresql://minix:minix@db:5432/minix
    depends_on: [catalogue]
  gateway:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8081:80"]
    depends_on: [catalogue]
